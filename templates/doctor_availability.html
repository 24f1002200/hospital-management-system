<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Availability</title>
    <style>
        .green{
            background-color: #d4edda;
            color: #155724;
        }
        .red{
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Doctor's Availability</h1>
    <button onclick="location.href='/doctor/{{doctor.username}}'">Back</button>
    <form action="/doctor/update/availability/{{doctor.id}}" method="post">
        <table border="1">
            {% for date, slots in availability.items() %}
                <tr>
                    <td>{{date}}</td>
                    <td>
                        <input 
                            type="checkbox" 
                            name="availability[{{ date }}][morning]" 
                            value="true" 
                            {% if not slots[0] %}checked disabled{% endif %}>
                        <label class="{{ 'green' if slots[0] else 'red' }}">
                            08:00 - 12:00 AM
                        </label>
                    </td>
                    <td>
                        <input 
                            type="checkbox" 
                            name="availability[{{ date }}][afternoon]" 
                            value="true" 
                            {% if not slots[1] %}checked disabled{% endif %}>
                        <label class="{{ 'green' if slots[1] else 'red' }}">
                            04:00 - 09:00 PM
                        </label>
                    </td>
                </tr>
            {% endfor %}
        </table>
        <button type="submit">save</button>
    </form>
</body>
</html>
