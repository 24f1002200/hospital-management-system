<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
</head>
<body>
    <h1>Update Profile: {{pat.username}}</h1>
    <form action="/update/patient/profile/{{pat.username}}" method="post">
        <label for="name">Name : </label>
        <input type="text" name="name" value="{% if profile[0] %} {{profile[0]}} {% endif %}" required>
        <br>
        <label for="contact">Contact : </label>
        <input type="text" name="contact" value="{% if profile[1] %} {{profile[1]}} {% endif %}" required>
        <br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
